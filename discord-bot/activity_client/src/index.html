<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eventos</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body data-state="starting">
  <header>
    <div class="title"><strong id="channel">Evento</strong><span id="status">Conectando…</span></div>
    <div class="sync" id="sync" title="Ida y vuelta al servidor y desfase del reloj">—</div>
  </header>
  <main>
    <section id="board" aria-label="Tablero">
      <h2>Jugadores</h2>
      <ul id="players" class="bars"></ul>
      <h2>Conectados</h2>
      <ul id="users"></ul>
      <p class="hint" id="hint"></p>
    </section>
    <section id="chat" aria-label="Canal del evento">
      <div id="hud" hidden>
        <div class="hud-boss" id="hud-boss" hidden><span id="boss-name"></span><div class="bar boss"><i id="boss-fill"></i><em id="boss-text"></em></div></div>
        <div class="hud-me" id="hud-me" hidden>
          <div class="bar hp"><i id="me-hp-fill"></i><em id="me-hp-text"></em></div>
          <div class="charges"><div class="bar mini"><i id="ch1-fill"></i></div><div class="bar mini"><i id="ch2-fill"></i></div><span id="streak" title="Racha de evades"></span></div>
        </div>
      </div>
      <div id="feed" role="log" aria-live="polite"></div>
      <div id="qte" data-active="false" aria-label="QTE">
        <div id="qte-info"><strong id="qte-title">Sin QTE por ahora</strong><span id="qte-sub">Los botones se activan cuando te toque responder.</span></div>
        <div id="qte-track" hidden><i class="zone evade" id="z-evade"></i><i class="zone parry" id="z-parry"></i><i class="zone bf" id="z-bf"></i><b id="qte-cursor"></b></div>
        <div id="qte-legend" hidden><span class="lg evade">Evade</span><span class="lg parry">Parry</span><span class="lg bf">Black Flash</span></div>
        <div id="actions">
          <button class="act" data-cmd="evade" type="button" title="E (o Alt+E mientras escribes)" disabled><b>Evade</b><small>E</small></button>
          <button class="act" data-cmd="parry" type="button" title="P (o Alt+P mientras escribes)" disabled><b>Parry</b><small>P</small></button>
          <button class="act" data-cmd="adapt" type="button" title="A (o Alt+A mientras escribes)" disabled><b>Adapt</b><small>A</small></button>
          <button class="act" data-cmd="attack" type="button" title="Q (o Alt+Q mientras escribes)" disabled><b>Ataque</b><small>Q</small></button>
        </div>
      </div>
      <form id="composer" autocomplete="off">
        <select id="as" aria-label="Escribir como" disabled></select>
        <input id="input" type="text" maxlength="2000" placeholder="Conectando…" enterkeyhint="send" disabled>
        <button id="send" type="submit" disabled>Enviar</button>
      </form>
    </section>
  </main>
  <div id="banner" hidden></div>
  <script src="./app.js"></script>
</body>
</html>
