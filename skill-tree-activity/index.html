<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Tree</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/styles/skill-tree.css">
  <link rel="stylesheet" href="/src/styles/animations.css">
</head>
<body>
  <div id="app">
    <div id="loading-screen">
      <div class="loader"></div>
      <p>Connecting to Discord...</p>
    </div>
    
    <div id="skill-tree-container" class="hidden">
      <header id="header">
        <div class="player-info">
          <img id="player-avatar" src="" alt="Avatar">
          <div class="player-details">
            <span id="player-name">Loading...</span>
            <span id="player-level">Lvl 1</span>
          </div>
        </div>
        <div class="skill-points">
          <span class="label">Skill Points</span>
          <span id="skill-points-value">0</span>
        </div>
      </header>
      
      <main id="skill-tree">
        <svg id="skill-connections"></svg>
        <div id="skill-nodes"></div>
      </main>
      
      <aside id="skill-details" class="hidden">
        <button id="close-details" class="close-btn">&times;</button>
        <div class="skill-icon-large"></div>
        <h2 id="detail-name">Skill Name</h2>
        <p id="detail-description">Skill description goes here.</p>
        <div id="detail-requirements">
          <h3>Requirements</h3>
          <ul id="requirements-list"></ul>
        </div>
        <div id="detail-effects">
          <h3>Effects</h3>
          <ul id="effects-list"></ul>
        </div>
        <button id="unlock-btn" class="unlock-btn" disabled>Unlock</button>
      </aside>
      
      <nav id="tree-navigation">
        <button class="nav-btn" data-tree="combat">⚔️ Combat</button>
        <button class="nav-btn" data-tree="defense">🛡️ Defense</button>
        <button class="nav-btn" data-tree="utility">✨ Utility</button>
        <button class="nav-btn" data-tree="domain">🌀 Domain</button>
      </nav>
    </div>
  </div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
