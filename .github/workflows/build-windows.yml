name: Build Windows app

# Builds EventosApp.exe (a windowed app, no terminal) plus a zip and a Windows installer, proves they
# work (smoke test; install -> shortcuts -> run -> update keeps data -> uninstall), and uploads them.
# To publish a GitHub Release: push a tag vX.Y.Z, or run this workflow by hand with "publish_release"
# ticked (the tag vX.Y.Z is then created for you from the app version). Either way the tag must match
# the version in discord-bot/eventos_app/__init__.py.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
    paths: ["discord-bot/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release (tag vX.Y.Z taken from the app version) from this commit"
        type: boolean
        default: false

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            discord-bot/requirements.txt
            discord-bot/requirements-desktop.txt

      - name: Read the app version (and check it matches the tag, if there is one)
        id: version
        working-directory: discord-bot
        run: |
          $version = (python -c "from eventos_app import __version__; print(__version__)").Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($env:GITHUB_REF_TYPE -eq "tag" -and "v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match the app version v$version (discord-bot/eventos_app/__init__.py)"
          }

      - name: Unit tests
        working-directory: discord-bot
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest tests -q

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build EventosApp.exe, zip and installer
        run: ./discord-bot/packaging/build_windows.ps1 -RequireInstaller

      - name: Smoke test the built exe
        run: |
          $exe = Join-Path $PWD "discord-bot\dist\EventosApp\EventosApp.exe"
          $out = Join-Path $PWD "smoke.json"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test", "--smoke-out", $out -PassThru -Wait
          if (Test-Path $out) { Get-Content $out } else { Write-Host "No smoke report was written" }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed (exit code $($p.ExitCode))" }

      - name: Test the installer (install, shortcuts, run, update keeps data, uninstall)
        run: ./discord-bot/packaging/test_installer.ps1

      - name: Show app logs if the smoke test failed
        if: failure()
        run: |
          Get-ChildItem -Recurse discord-bot\dist\EventosApp\logs -ErrorAction SilentlyContinue |
            Where-Object { -not $_.PSIsContainer } |
            ForEach-Object { Write-Host "=== $($_.FullName)"; Get-Content $_.FullName -Tail 60 }

      - uses: actions/upload-artifact@v4
        with:
          name: EventosApp-Installer
          path: discord-bot/dist/EventosApp-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: EventosApp-windows
          path: discord-bot/dist/EventosApp-windows.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            EventosApp-Setup-*.exe
            EventosApp-windows.zip
          body: |
            ## Eventos App para Windows

            Panel de escritorio para manejar el bot de eventos QTE, sin terminal.

            ### Descarga
            - **`EventosApp-Setup-<versión>.exe`** (recomendado): instalador con acceso directo en el escritorio y en el menú Inicio. No pide administrador.
            - **`EventosApp-windows.zip`**: versión portátil. Descomprime en cualquier carpeta y abre `EventosApp.exe`.

            ### Primer uso
            *Configuración* → pega el token del bot → *Guardar cambios* → *Panel* → *Iniciar bot*.

            ### Notas
            - Windows SmartScreen puede avisar la primera vez porque el instalador no está firmado: *Más información* → *Ejecutar de todas formas*.
            - Para actualizar, ejecuta el instalador nuevo encima: se conservan tu token, los datos de jugadores y los GIFs.
          generate_release_notes: true
