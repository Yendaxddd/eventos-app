<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos - Real-time RPG Campaign</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: rgba(0,0,0,0.3);
            padding: 1rem;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .container {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }
        
        .game-area {
            display: grid;
            gap: 20px;
            grid-template-columns: 1fr 300px;
        }
        
        @media (max-width: 768px) {
            .game-area {
                grid-template-columns: 1fr;
            }
        }
        
        .main-panel {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .panel {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        /* QTE Display */
        .qte-display {
            text-align: center;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .qte-active {
            animation: pulse 0.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .qte-title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .qte-timer {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #ffd700;
        }
        
        .qte-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .action-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .action-btn:active {
            transform: translateY(0);
        }
        
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-evade { background: linear-gradient(135deg, #667eea 0%, #4a5fc1 100%); }
        .btn-parry { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .btn-save { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        
        /* HP Bar */
        .hp-container {
            margin-bottom: 20px;
        }
        
        .hp-bar {
            background: rgba(0,0,0,0.3);
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }
        
        .hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #00c851 0%, #00ff00 100%);
            transition: width 0.5s ease, background 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .hp-fill.danger { background: linear-gradient(90deg, #ff4444 0%, #ff6b6b 100%); }
        .hp-fill.warning { background: linear-gradient(90deg, #ffbb33 0%, #ffdd00 100%); }
        .hp-fill.revenge { 
            background: linear-gradient(90deg, #8b00ff 0%, #ff00ff 100%); 
            animation: revenge-glow 1s infinite;
        }
        
        @keyframes revenge-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(255,0,255,0.5); }
            50% { box-shadow: 0 0 20px rgba(255,0,255,0.8); }
        }
        
        .hp-text {
            color: white;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        
        /* Power Gauge */
        .power-container {
            display: flex;
            gap: 10px;
        }
        
        .power-slot {
            flex: 1;
        }
        
        .power-bar {
            background: rgba(0,0,0,0.3);
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        .power-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b00 0%, #ffd700 100%);
            transition: width 0.3s ease;
        }
        
        .power-fill.ready {
            animation: power-ready 1s infinite;
        }
        
        @keyframes power-ready {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        /* Combat Log */
        .combat-log {
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        
        .log-entry {
            padding: 5px;
            margin: 5px 0;
            border-left: 3px solid #667eea;
            padding-left: 10px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .log-success { border-color: #00c851; }
        .log-fail { border-color: #ff4444; }
        .log-special { border-color: #ffd700; }
        
        /* Debug Terminal */
        .debug-terminal {
            position: fixed;
            right: 0;
            top: 0;
            width: 400px;
            height: 100vh;
            background: rgba(0,0,0,0.9);
            border-left: 2px solid rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        
        .debug-terminal.open {
            transform: translateX(0);
        }
        
        .debug-terminal-header {
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-bottom: 1px solid rgba(255,255,255,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .debug-terminal-content {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #00ff00;
        }
        
        .debug-entry {
            margin: 2px 0;
            padding: 2px 5px;
            border-left: 2px solid transparent;
            word-wrap: break-word;
        }
        
        .debug-entry.info { border-color: #00ff00; color: #00ff00; }
        .debug-entry.warn { border-color: #ffff00; color: #ffff00; }
        .debug-entry.error { border-color: #ff0000; color: #ff0000; }
        .debug-entry.ws-in { border-color: #00ffff; color: #00ffff; }
        .debug-entry.ws-out { border-color: #ff00ff; color: #ff00ff; }
        
        .debug-toggle {
            position: fixed;
            right: 10px;
            bottom: 10px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0,0,0,0.8);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s;
        }
        
        .debug-toggle:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }
        
        .debug-terminal input {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-top: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        /* Connection Status */
        .status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            border-radius: 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
        }
        
        .status-dot.connected { background: #00c851; }
        
        /* Join Form */
        .join-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .join-form input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 1rem;
        }
        
        .join-form input::placeholder {
            color: rgba(255,255,255,0.7);
        }
        
        .join-form button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .join-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <!-- Debug Terminal -->
    <div class="debug-terminal" id="debugTerminal">
        <div class="debug-terminal-header">
            <span>🖥️ Debug Terminal</span>
            <button onclick="toggleDebugTerminal()" style="background: none; border: none; color: white; cursor: pointer;">✖</button>
        </div>
        <div class="debug-terminal-content" id="debugContent"></div>
        <input type="text" id="debugInput" placeholder="Type debug command..." onkeypress="handleDebugCommand(event)" />
    </div>
    
    <!-- Debug Toggle Button -->
    <div class="debug-toggle" onclick="toggleDebugTerminal()" title="Toggle Debug Terminal">
        <span>🐛</span>
    </div>
    
    <div class="header">
        <h1>⚔️ EVENTOS ⚔️</h1>
        <p>Real-time RPG Campaign System</p>
    </div>
    
    <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Disconnected</span>
    </div>
    
    <div class="container">
        <div class="join-form" id="joinForm">
            <input type="text" id="userIdInput" placeholder="Enter your username" />
            <input type="text" id="campaignInput" placeholder="Campaign ID (or leave empty for test)" />
            <button onclick="connect()">Join Campaign</button>
        </div>
        
        <div class="game-area" id="gameArea" style="display: none;">
            <div class="main-panel">
                <div class="qte-display" id="qteDisplay">
                    <div class="qte-title">Waiting for QTE...</div>
                    <div class="qte-timer" id="qteTimer"></div>
                    <div class="qte-actions" id="qteActions" style="display: none;">
                        <button class="action-btn btn-evade" onclick="sendAction('evade')">EVADE</button>
                        <button class="action-btn btn-parry" onclick="sendAction('parry')">PARRY</button>
                        <button class="action-btn btn-save" onclick="sendAction('save')">SAVE</button>
                    </div>
                </div>
                
                <div class="combat-log" id="combatLog">
                    <div class="log-entry">Welcome to Eventos!</div>
                </div>
                <div class="attack-input" style="margin-top: 20px;">
                    <input type="text" id="attackInput" placeholder="Type your attack..." onkeypress="handleAttackInput(event)" style="width: 100%; padding: 10px; border-radius: 10px; border: none; background: rgba(0,0,0,0.3); color: white; font-size: 1rem;" />
                </div>
            </div>
            
            <div class="side-panel">
                <div class="panel">
                    <h3>Player HP</h3>
                    <div class="hp-container">
                        <div class="hp-bar">
                            <div class="hp-fill" id="hpBar" style="width: 100%">
                                <span class="hp-text" id="hpText">100/100</span>
                            </div>
                        </div>
                    </div>
                    
                    <h3>Boss HP</h3>
                    <div class="hp-container">
                        <div class="hp-bar">
                            <div class="hp-fill" id="bossHpBar" style="width: 100%; background: linear-gradient(90deg, #ff4444 0%, #ff6b6b 100%);">
                                <span class="hp-text" id="bossHpText">100/100</span>
                            </div>
                        </div>
                    </div>
                    
                    <h3>Power</h3>
                    <div class="power-container">
                        <div class="power-slot">
                            <small>Power 1</small>
                            <div class="power-bar">
                                <div class="power-fill" id="power1Bar" style="width: 0%"></div>
                            </div>
                        </div>
                        <div class="power-slot">
                            <small>Power 2</small>
                            <div class="power-bar">
                                <div class="power-fill" id="power2Bar" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="panel">
                    <h3>Stats</h3>
                    <div id="stats">
                        <p>QTEs: <span id="statQtes">0</span></p>
                        <p>Success Rate: <span id="statSuccess">0%</span></p>
                        <p>Best Time: <span id="statBest">-</span></p>
                    </div>
                </div>
                
                <div class="panel">
                    <h3>Actions</h3>
                    <div class="admin-actions" style="display: flex; flex-direction: column; gap: 10px;">
                        <button class="action-btn" onclick="triggerTestQTE('easy')">Test Easy QTE</button>
                        <button class="action-btn" onclick="triggerTestQTE('medium')">Test Medium QTE</button>
                        <button class="action-btn" onclick="triggerTestQTE('hard')">Test Hard QTE</button>
                        <button class="action-btn" onclick="triggerTestQTE('impossible')">Test Impossible QTE</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let ws = null;
        let userId = null;
        let campaignId = null;
        let currentQTE = null;
        let qteStartTime = null;
        let debugEnabled = true;
        
        // Debug logging
        function debugLog(message, type = 'info') {
            if (!debugEnabled) return;
            
            const debugContent = document.getElementById('debugContent');
            const entry = document.createElement('div');
            entry.className = `debug-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            debugContent.appendChild(entry);
            
            // Auto-scroll to bottom
            debugContent.scrollTop = debugContent.scrollHeight;
            
            // Keep only last 100 entries
            while (debugContent.children.length > 100) {
                debugContent.removeChild(debugContent.firstChild);
            }
            
            // Also log to browser console
            console.log(`[DEBUG ${type}] ${message}`);
        }
        
        function toggleDebugTerminal() {
            const terminal = document.getElementById('debugTerminal');
            terminal.classList.toggle('open');
            debugLog('Debug terminal toggled', 'info');
        }
        
        function handleDebugCommand(event) {
            if (event.key === 'Enter') {
                const input = document.getElementById('debugInput');
                const command = input.value.trim();
                if (!command) return;
                
                debugLog(`> ${command}`, 'info');
                processDebugCommand(command);
                input.value = '';
            }
        }
        
        function processDebugCommand(command) {
            const parts = command.split(' ');
            const cmd = parts[0].toLowerCase();
            
            switch(cmd) {
                case 'help':
                    debugLog('Available commands:', 'info');
                    debugLog('  help - Show this help', 'info');
                    debugLog('  clear - Clear terminal', 'info');
                    debugLog('  stats - Show player stats', 'info');
                    debugLog('  qte [difficulty] - Trigger QTE', 'info');
                    debugLog('  damage [amount] - Take damage', 'info');
                    debugLog('  heal [amount] - Heal HP', 'info');
                    debugLog('  ws - Show WebSocket status', 'info');
                    debugLog('  boss [name] [hp] - Create a boss', 'info');
                    break;
                    
                case 'clear':
                    document.getElementById('debugContent').innerHTML = '';
                    debugLog('Terminal cleared', 'info');
                    break;
                    
                case 'stats':
                    debugLog(`User: ${userId || 'Not connected'}`, 'info');
                    debugLog(`Campaign: ${campaignId || 'Not joined'}`, 'info');
                    debugLog(`WebSocket: ${ws?.readyState === 1 ? 'Connected' : 'Disconnected'}`, 'info');
                    break;
                    
                case 'qte':
                    const difficulty = parts[1] || 'medium';
                    triggerTestQTE(difficulty);
                    break;
                    
                case 'damage':
                    const dmg = parseInt(parts[1]) || 10;
                    debugLog(`Simulating ${dmg} damage`, 'warn');
                    // Send damage command via WebSocket
                    if (ws && ws.readyState === 1) {
                        ws.send(JSON.stringify({
                            type: 'debug_damage',
                            amount: dmg
                        }));
                    }
                    break;
                    
                case 'heal':
                    const heal = parseInt(parts[1]) || 20;
                    debugLog(`Healing ${heal} HP`, 'info');
                    // Send heal command via WebSocket
                    if (ws && ws.readyState === 1) {
                        ws.send(JSON.stringify({
                            type: 'debug_heal',
                            amount: heal
                        }));
                    }
                    break;
                    
                case 'ws':
                    if (ws) {
                        debugLog(`WebSocket State: ${ws.readyState}`, 'info');
                        debugLog('0=CONNECTING, 1=OPEN, 2=CLOSING, 3=CLOSED', 'info');
                    } else {
                        debugLog('WebSocket not initialized', 'error');
                    }
                    break;
                
                case 'boss':
                    const bossName = parts[1] || 'Test Boss';
                    const bossHp = parseInt(parts[2]) || 1000;
                    if (campaignId) {
                        fetch(`http://localhost:7000/api/boss/create?campaign_id=${campaignId}&name=${bossName}&hp=${bossHp}`, {
                            method: 'POST'
                        })
                        .then(res => res.json())
                        .then(data => {
                            debugLog(`Boss created: ${JSON.stringify(data)}`, 'info');
                        })
                        .catch(err => {
                            debugLog(`Error creating boss: ${err}`, 'error');
                        });
                    } else {
                        debugLog('You must join a campaign first', 'error');
                    }
                    break;
                    
                default:
                    debugLog(`Unknown command: ${cmd}`, 'error');
                    debugLog('Type "help" for available commands', 'info');
            }
        }
        
        function connect() {
            userId = document.getElementById('userIdInput').value || 'player_' + Date.now();
            campaignId = document.getElementById('campaignInput').value || 'test_campaign';
            
            if (!userId) {
                alert('Please enter a username');
                return;
            }
            
            // Connect to WebSocket
            ws = new WebSocket(`ws://localhost:7000/ws/${userId}`);
            
            ws.onopen = () => {
                console.log('Connected to server');
                debugLog('WebSocket connected to server', 'info');
                document.getElementById('statusDot').classList.add('connected');
                document.getElementById('statusText').textContent = 'Connected';
                document.getElementById('joinForm').style.display = 'none';
                document.getElementById('gameArea').style.display = 'grid';
                
                // Join campaign
                const joinMsg = JSON.stringify({
                    type: 'join_campaign',
                    campaign_id: campaignId
                });
                ws.send(joinMsg);
                debugLog(`WS >> ${joinMsg}`, 'ws-out');
                
                addLog('Connected to campaign: ' + campaignId, 'success');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                debugLog(`WS << ${event.data}`, 'ws-in');
                handleMessage(data);
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                debugLog(`WebSocket error: ${error}`, 'error');
                addLog('Connection error!', 'fail');
            };
            
            ws.onclose = () => {
                document.getElementById('statusDot').classList.remove('connected');
                document.getElementById('statusText').textContent = 'Disconnected';
                debugLog('WebSocket disconnected', 'warn');
                addLog('Disconnected from server', 'fail');
            };
        }
        
        function handleMessage(data) {
            switch(data.type) {
                case 'qte_triggered':
                    handleQTETrigger(data);
                    break;
                case 'qte_result':
                    handleQTEResult(data);
                    break;
                case 'hp_update':
                    handleHPUpdate(data);
                    break;
                case 'stats_update':
                    handleStatsUpdate(data);
                    break;
                case 'power_update':
                    handlePowerUpdate(data);
                    break;
                case 'boss_hp_update':
                    handleBossHpUpdate(data);
                    break;
                case 'attack_result':
                    handleAttackResult(data);
                    break;
                case 'player_joined':
                    addLog(`Player joined: ${data.user_id}`, 'success');
                    break;
            }
        }
        
        function handleQTETrigger(data) {
            if (currentQTE) {
                // Don't overlap QTEs
                return;
            }
            
            currentQTE = data;
            qteStartTime = Date.now();
            
            const display = document.getElementById('qteDisplay');
            display.classList.add('qte-active');
            display.querySelector('.qte-title').textContent = `⚡ ${data.difficulty.toUpperCase()} QTE!`;
            
            document.getElementById('qteActions').style.display = 'flex';
            
            addLog(`QTE Triggered! Difficulty: ${data.difficulty}`, 'special');
            
            // Start countdown
            let timeLeft = data.window;
            const timerInterval = setInterval(() => {
                if (!currentQTE || currentQTE.qte_id !== data.qte_id) {
                    clearInterval(timerInterval);
                    return;
                }
                
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (currentQTE) {
                        // Fail the QTE if no action was taken
                        sendAction('fail');
                    }
                } else {
                    document.getElementById('qteTimer').textContent = timeLeft.toFixed(1) + 's';
                }
            }, 100);
            
            currentQTE.timerInterval = timerInterval;
        }
        
        function sendAction(action) {
            if (!currentQTE || !ws) return;
            
            const responseTime = (Date.now() - qteStartTime) / 1000;
            
            const msg = JSON.stringify({
                type: 'qte_response',
                qte_id: currentQTE.qte_id,
                campaign_id: campaignId,
                action: action,
                response_time: responseTime
            });
            ws.send(msg);
            debugLog(`WS >> ${msg}`, 'ws-out');
            
            endQTE();
            addLog(`Action: ${action.toUpperCase()} (${responseTime.toFixed(2)}s)`, 'success');
        }
        
        function endQTE() {
            document.getElementById('qteDisplay').classList.remove('qte-active');
            document.getElementById('qteActions').style.display = 'none';
            document.getElementById('qteTimer').textContent = '';
            document.querySelector('.qte-title').textContent = 'Waiting for QTE...';
            currentQTE = null;
        }
        
        function handleQTEResult(data) {
            if (data.user_id === userId) {
                if (data.success) {
                    addLog(`SUCCESS! ${data.action} (${data.response_time.toFixed(2)}s)`, 'success');
                } else {
                    addLog(`FAILED! Too slow!`, 'fail');
                }
            }
        }
        
        function handleHPUpdate(data) {
            if (data.user_id === userId && data.hp) {
                updateHP(data.hp.current, data.hp.max);
            }
        }
        
        function updateHP(current, max) {
            const percentage = (current / max) * 100;
            const hpBar = document.getElementById('hpBar');
            
            hpBar.style.width = percentage + '%';
            document.getElementById('hpText').textContent = `${current}/${max}`;
            
            // Change color based on HP
            hpBar.className = 'hp-fill';
            if (percentage <= 20) {
                hpBar.classList.add('revenge');
                addLog('⚡ REVENGE MODE ACTIVATED!', 'special');
            } else if (percentage <= 30) {
                hpBar.classList.add('danger');
            } else if (percentage <= 60) {
                hpBar.classList.add('warning');
            }
        }
        
        function addLog(message, type = '') {
            const log = document.getElementById('combatLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            if (type) entry.classList.add('log-' + type);
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.insertBefore(entry, log.firstChild);
            
            // Keep only last 20 entries
            while (log.children.length > 20) {
                log.removeChild(log.lastChild);
            }
        }

        function handleStatsUpdate(data) {
            if (data.user_id === userId) {
                document.getElementById('statQtes').textContent = data.stats.total_attempts;
                const successRate = data.stats.total_attempts > 0 ? (data.stats.successful / data.stats.total_attempts * 100).toFixed(1) : 0;
                document.getElementById('statSuccess').textContent = `${successRate}%`;
                document.getElementById('statBest').textContent = data.stats.best_time === Infinity ? '-' : `${data.stats.best_time.toFixed(2)}s`;
            }
        }
        
        function handlePowerUpdate(data) {
            if (data.user_id === userId) {
                document.getElementById('power1Bar').style.width = `${data.power.power1}%`;
                document.getElementById('power2Bar').style.width = `${data.power.power2}%`;
                
                if (data.power.power1 >= 100) {
                    document.getElementById('power1Bar').classList.add('ready');
                } else {
                    document.getElementById('power1Bar').classList.remove('ready');
                }
                
                if (data.power.power2 >= 100) {
                    document.getElementById('power2Bar').classList.add('ready');
                } else {
                    document.getElementById('power2Bar').classList.remove('ready');
                }
            }
        }
        
        function handleBossHpUpdate(data) {
            const percentage = (data.boss_hp / data.boss_max_hp) * 100;
            document.getElementById('bossHpBar').style.width = `${percentage}%`;
            document.getElementById('bossHpText').textContent = `${data.boss_hp}/${data.boss_max_hp}`;
        }

        function handleAttackResult(data) {
            if (data.user_id === userId) {
                addLog(`You dealt ${data.damage} damage with ${data.action}! (Combo: ${data.combo_multiplier}x, Quality: +${data.quality_bonus})`, 'success');
            } else {
                addLog(`Player ${data.user_id} dealt ${data.damage} damage with ${data.action}!`, 'info');
            }
        }

        function handleAttackResult(data) {
            if (data.user_id === userId) {
                addLog(`You dealt ${data.damage} damage! (Combo: ${data.combo_multiplier}x, Quality: +${data.quality_bonus})`, 'success');
            } else {
                addLog(`Player ${data.user_id} dealt ${data.damage} damage!`, 'info');
            }
        }
        
        function triggerTestQTE(difficulty = 'medium') {
            if (!campaignId) return;
            
            fetch(`http://localhost:7000/api/trigger_qte?campaign_id=${campaignId}&difficulty=${difficulty}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                console.log('QTE triggered:', data);
            })
            .catch(error => {
                console.error('Error triggering QTE:', error);
                addLog('Failed to trigger QTE', 'fail');
            });
        }
        
        function handleAttackInput(event) {
            if (event.key === 'Enter') {
                const input = document.getElementById('attackInput');
                const text = input.value.trim();
                if (!text || !ws || ws.readyState !== 1) return;
                
                ws.send(JSON.stringify({
                    type: 'action',
                    action_type: 'attack',
                    campaign_id: campaignId,
                    text: text
                }));
                
                input.value = '';
            }
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (!currentQTE) return;
            
            switch(e.key.toLowerCase()) {
                case 'q':
                case 'a':
                    sendAction('evade');
                    break;
                case 'w':
                case 's':
                    sendAction('parry');
                    break;
                case 'e':
                case 'd':
                    sendAction('save');
                    break;
            }
        });
    </script>
</body>
</html>
